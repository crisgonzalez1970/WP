<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control de acceso</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Sistema de acceso</p>
          <h1>Control de acceso</h1>
        </div>
      </header>

      <section id="login-view" class="panel active">
        <div class="card">
          <h2>Inicia sesión</h2>
          <p class="subtitle">Ingresa tus credenciales.</p>
          <form id="login-form" class="form-stack">
            <label for="username">Usuario</label>
            <input id="username" name="username" placeholder="demo" required />

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" placeholder="demo123" required />

            <button type="submit">Entrar</button>
          </form>
          <p id="login-message" class="message" aria-live="polite"></p>
        </div>
      </section>

      <section id="dashboard-view" class="panel">
        <div class="dashboard-card">
          <div class="dashboard-copy">
            <p class="eyebrow">Bienvenido</p>
            <h2 id="welcome-name">Hola, usuario</h2>
            <p>Has ingresado correctamente al sistema y puedes administrar los usuarios desde el panel.</p>
            <div class="dashboard-actions">
              <button id="logout-btn" type="button">Cerrar sesión</button>
              <button id="show-abm-dashboard-btn" class="ghost-btn" type="button">ABM Usuarios</button>
            </div>
          </div>
          <img
            class="welcome-image"
            src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80"
            alt="Paisaje con montañas y lago"
          />
        </div>
      </section>

      <section id="users-view" class="panel">
        <div class="card wide-card">
          <div class="section-title">
            <div>
              <p class="eyebrow">Administración</p>
              <h2>ABM Usuarios</h2>
            </div>
            <button id="back-to-login-btn" class="ghost-btn" type="button">Volver</button>
          </div>

          <form id="user-form" class="form-stack">
            <input id="user-id" type="hidden" />
            <label for="user-username">Usuario</label>
            <input id="user-username" name="user-username" required />

            <label for="user-password">Contraseña</label>
            <input id="user-password" name="user-password" required />

            <label for="user-role">Rol</label>
            <select id="user-role" name="user-role">
              <option value="viewer">viewer</option>
              <option value="editor">editor</option>
              <option value="admin">admin</option>
            </select>

            <div class="form-actions">
              <button type="submit">Guardar usuario</button>
              <button id="cancel-user-btn" class="ghost-btn" type="button">Cancelar</button>
            </div>
          </form>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Usuario</th>
                  <th>Contraseña</th>
                  <th>Rol</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="users-table-body"></tbody>
            </table>
          </div>

          <p id="users-message" class="message" aria-live="polite"></p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
