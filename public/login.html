<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login</title>
  </head>
  <body>
    <h2>Login</h2>
    <form id="loginForm">
      <label>Usuario: <input name="username" value="admin" /></label><br />
      <label>Clave: <input name="password" type="password" value="admin" /></label><br />
      <button type="submit">Entrar</button>
    </form>
    <div id="msg"></div>
    <script>
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = { username: fd.get('username'), password: fd.get('password') };
        const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (res.ok) {
          window.location.href = '/public/app.html'.replace('/public','');
        } else {
          const j = await res.json();
          document.getElementById('msg').innerText = j.error || 'Error';
        }
      });
    </script>
  </body>
</html>
